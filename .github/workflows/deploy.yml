name: Deploy Backend to cPanel (SSH Pull)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        env:
          SSH_PASS: ${{ secrets.CPANEL_SSH_PASSWORD }}
          SSH_HOST: "cipressa.id.rapidplex.com"
          SSH_PORT: "64000"
          SSH_USER: "sanitas1"
        run: |
          # 1. Pasang utility sshpass
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          # 2. Eksekusi perintah deployment langsung di dalam server cPanel
          sshpass -p "$SSH_PASS" ssh -p $SSH_PORT -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} << 'EOF'
            set -e

            # Masuk ke direktori backend Laravel
            cd /home/sanitas1/public_html/backend

            # Ambil update kode terbaru langsung dari GitHub
            git fetch origin main
            git reset --hard origin/main

            # Eksekusi dependensi dan optimasi Laravel
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize:clear
            php artisan optimize

            echo "Deployment Backend Berhasil!"
          EOF